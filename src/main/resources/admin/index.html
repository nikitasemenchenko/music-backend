<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Music Admin</title>

    <link rel="stylesheet" href="/admin/style.css">
    <script type="module" src="/admin/main.js"></script>
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">
            <span>Music Admin</span>
        </div>

        <nav class="navigation">
            <a href="/admin/" class="nav-link active">
                Каталог треков
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="page-header">
            <div>
                <h1>Каталог треков</h1>
            </div>

            <div class="header-actions">
                <button id="refresh-btn" class="btn btn-secondary">
                    Обновить
                </button>

                <button id="add-track-btn" class="btn btn-primary">
                    + Добавить трек
                </button>

                <button id="manage-references-btn" class="btn btn-secondary">
                    Управление
                </button>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span class="stat-label">Всего треков</span>
                <strong id="tracks-count">0</strong>
            </div>
        </section>

        <section class="catalog-panel">

            <div class="catalog-header">
                <h2>Все композиции</h2>

                <input
                        id="search-input"
                        class="search-input"
                        type="search"
                        placeholder="По названию или исполнителю"
                        aria-label="Поиск треков"
                >
            </div>

            <p id="notice" class="notice" role="alert" hidden></p>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Обложка</th>
                        <th>Название</th>
                        <th>Исполнитель</th>
                        <th>Альбом</th>
                        <th>Длительность</th>
                        <th>Действия</th>
                    </tr>
                    </thead>

                    <tbody id="tracks-body"></tbody>
                </table>
            </div>

            <p id="empty-state" class="empty-state" hidden>
                Треки не найдены
            </p>
        </section>
    </main>
</div>

<section id="player-panel" class="player-panel" hidden>
    <div class="player-info">
        <span class="player-label">Сейчас играет</span>
        <strong id="playing-title"></strong>
    </div>

    <audio id="audio-player" controls preload="none"></audio>

    <button
            id="close-player"
            class="close-player"
            aria-label="Закрыть плеер"
    >
        ✕
    </button>
</section>

<dialog id="track-dialog" class="track-dialog">

    <form id="track-form">

        <div class="form-header">
            <h2 id="form-title">Добавление трека</h2>

            <button type="button"
                    id="cancel-track-btn"
                    class="close-player">
                ✕
            </button>
        </div>

        <p id="form-error" class="form-error" hidden></p>

        <div class="form-field">
            <label for="track-title">Название трека *</label>

            <input id="track-title"
                   type="text"
                   maxlength="255"
                   required>
        </div>

        <div class="form-grid">

            <div class="form-field">
                <label for="track-duration">
                    Длительность в секундах *
                </label>

                <input id="track-duration"
                       type="number"
                       min="0.001"
                       max="2147483"
                       step="0.001"
                       placeholder="Заполнится после выбора MP3"
                       required>
            </div>

            <div class="form-field">
                <label for="track-release-date">
                    Дата выпуска
                </label>

                <input id="track-release-date" type="date">
            </div>

        </div>

        <div class="form-field">
            <label for="track-artists">Исполнители *</label>

            <input
                    id="artists-search"
                    type="search"
                    placeholder="Поиск исполнителя..."
            >

            <select
                    id="track-artists"
                    data-reference-type="artists"
                    multiple
                    size="4">
            </select>

            <button type="button"
                    class="reference-add-btn"
                    data-create-reference="artists">
                + Создать исполнителя
            </button>
        </div>

        <div class="form-field">
            <label for="track-albums">Альбомы</label>

            <input
                    id="albums-search"
                    type="search"
                    placeholder="Поиск альбома..."
            >

            <select
                    id="track-albums"
                    data-reference-type="albums"
                    multiple
                    size="3">
            </select>

            <button type="button"
                    class="reference-add-btn"
                    data-create-reference="albums">
                + Создать альбом
            </button>
        </div>

        <div class="form-field">
            <label for="track-genres">Жанры</label>

            <input
                    id="genres-search"
                    type="search"
                    placeholder="Поиск жанра..."
            >

            <select
                    id="track-genres"
                    data-reference-type="genres"
                    multiple
                    size="3">
            </select>

            <button type="button"
                    class="reference-add-btn"
                    data-create-reference="genres">
                + Создать жанр
            </button>
        </div>

        <div class="form-field">
            <label for="track-audio">MP3</label>

            <input id="track-audio"
                   type="file"
                   accept=".mp3,audio/mpeg">
        </div>

        <div class="form-field">
            <label for="track-cover">Обложка</label>

            <input id="track-cover"
                   type="file"
                   accept=".jpg,.jpeg,.png,.webp">
        </div>

        <div class="form-footer">
            <button type="button"
                    id="cancel-track-footer"
                    class="btn btn-secondary">
                Отмена
            </button>

            <button type="submit"
                    id="save-track-btn"
                    class="btn btn-primary">
                Сохранить
            </button>
        </div>

    </form>

</dialog>
<dialog id="references-dialog" class="track-dialog references-dialog">

    <div class="references-dialog-content">

        <div class="form-header">
            <h2>Управление справочниками</h2>

            <button type="button"
                    id="close-references-btn"
                    class="close-player">
                ✕
            </button>
        </div>

        <p id="references-notice"
           class="references-notice"
           hidden></p>

        <div class="reference-management-grid">

            <!-- Исполнители -->
            <section class="reference-management-section">
                <div class="reference-management-header">
                    <h3>Исполнители</h3>
                    <button type="button"
                            class="reference-add-btn"
                            data-manage-create="artists">
                        + Добавить
                    </button>
                </div>

                <input type="search"
                       id="manage-artists-search"
                       class="reference-management-search"
                       placeholder="Поиск исполнителя...">

                <div id="reference-artists-list"
                     class="reference-management-list"></div>
            </section>

            <!-- Альбомы -->
            <section class="reference-management-section">
                <div class="reference-management-header">
                    <h3>Альбомы</h3>
                    <button type="button"
                            class="reference-add-btn"
                            data-manage-create="albums">
                        + Добавить
                    </button>
                </div>

                <input type="search"
                       id="manage-albums-search"
                       class="reference-management-search"
                       placeholder="Поиск альбома...">

                <div id="reference-albums-list"
                     class="reference-management-list"></div>
            </section>

            <!-- Жанры -->
            <section class="reference-management-section">
                <div class="reference-management-header">
                    <h3>Жанры</h3>
                    <button type="button"
                            class="reference-add-btn"
                            data-manage-create="genres">
                        + Добавить
                    </button>
                </div>

                <input type="search"
                       id="manage-genres-search"
                       class="reference-management-search"
                       placeholder="Поиск жанра...">

                <div id="reference-genres-list"
                     class="reference-management-list"></div>
            </section>

        </div>
    </div>
</dialog>
<dialog id="album-dialog" class="track-dialog album-dialog">
    <form id="album-form" class="album-form">

        <div class="form-header">
            <h2>Создание альбома</h2>

            <button type="button"
                    id="cancel-album-btn"
                    class="close-player">
                ✕
            </button>
        </div>

        <p id="album-error" class="form-error" hidden></p>

        <div class="form-field">
            <label for="album-title">Название альбома *</label>

            <input id="album-title"
                   type="text"
                   maxlength="255"
                   required>
        </div>

        <div class="form-field">
            <label for="album-release-date">Дата выхода</label>

            <input id="album-release-date" type="date">
        </div>

        <div class="form-footer">
            <button type="button"
                    id="cancel-album-footer"
                    class="btn btn-secondary">
                Отмена
            </button>

            <button type="submit" class="btn btn-primary">
                Создать альбом
            </button>
        </div>

    </form>
</dialog>
</body>
</html>
