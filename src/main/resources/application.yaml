ktor:
  deployment:
    host: "0.0.0.0"
    port: 8080
  application:
    modules:
      - ru.magnum.ApplicationKt.module

database:
  jdbcUrl: "$DB_JDBC_URL"
  username: "$DB_USERNAME"
  password: "$DB_PASSWORD"
  driverClassName: "org.postgresql.Driver"
  maximumPoolSize: 10

storage:
  root: "${STORAGE_ROOT:storage}"